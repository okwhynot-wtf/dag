name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache toolchain and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            formal/spine/.lake
            formal/ledger/.lake
            formal/bridge/.lake
            formal/dictionary/.lake
          key: lean-${{ hashFiles('formal/lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            lean-${{ hashFiles('formal/lean-toolchain') }}-

      - name: Verify
        run: bash VERIFY.sh
